# EN: nginx config. Browser -> https://localhost:8443 -> nginx -> the right service by URL prefix.
# Franco: config bta3 nginx. El browser -> https://localhost:8443 -> nginx -> el service el sa7 7asab awel el URL.

# EN: plain HTTP (host port 8080) is always redirected to HTTPS (host port 8443).
# Franco: el HTTP el 3ady (8080) dayman beyetwagga3 lel HTTPS (8443).
server {
    listen 80;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # EN: self-signed certificate made by scripts/dev.py (the browser will warn once; that is expected locally).
    # Franco: certificate self-signed men scripts/dev.py (el browser hayez3ak mara; da tabe3y local).
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # EN: certificates may be up to 5 MB; the service itself returns 413 above 5 MB, nginx stops at 6 MB.
    # Franco: el certificate le 5 MB; el service beyerga3 413 foo2 5 MB, w nginx beyewa2ef 3and 6 MB.
    client_max_body_size 6m;

    # EN: Docker's DNS, so nginx still starts even if a service is not up yet.
    # Franco: DNS bta3 Docker 3ashan nginx yeshtaghal7atta law service lessa ma-ettalaa3tsh.
    resolver 127.0.0.11 valid=10s;

    # EN: headers passed to the services (Authorization is passed by default, we never log it).
    # Franco: el headers elly bet-roo7 lel services (el Authorization betero7 lewa7do, w ma-bnektebhash fel logs).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # EN: health checks per service, used by "python scripts/dev.py health".
    # Franco: health check le kol service, beyest3melha "python scripts/dev.py health".
    location = /health/s1 { set $up http://s1:5001; rewrite ^ /health break; proxy_pass $up; }
    location = /health/s2 { set $up http://s2:5002; rewrite ^ /health break; proxy_pass $up; }
    location = /health/s3 { set $up http://s3:5003; rewrite ^ /health break; proxy_pass $up; }

    # EN: routing by prefix. S1 = employees, teams, trainings, assignments.
    # Franco: tawzee3 7asab el prefix. S1 = employees, teams, trainings, assignments.
    location ~ ^/api/(employees|teams|trainings|assignments)(/|$) {
        set $up http://s1:5001;
        proxy_pass $up;
    }

    # EN: S2 = certificates and compliance.
    # Franco: S2 = certificates w compliance.
    location ~ ^/api/(certificates|compliance)(/|$) {
        set $up http://s2:5002;
        proxy_pass $up;
    }

    # EN: S3 = dashboard and reports.
    # Franco: S3 = dashboard w reports.
    location ~ ^/api/(dashboard|reports)(/|$) {
        set $up http://s3:5003;
        proxy_pass $up;
    }
}
