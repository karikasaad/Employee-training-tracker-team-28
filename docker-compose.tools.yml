# EN: extra helpers, loaded automatically by scripts/dev.py next to docker-compose.yml.
#     init = creates the AWS-like resources in Floci; spike = tests what Floci supports; scheduler = fallback cron.
# Franco: helpers eda-feya, scripts/dev.py beyeqraha ma3 docker-compose.yml.
#     init = beye3mel el 7agat fe Floci; spike = beyetest Floci beyedaam eh; scheduler = cron badeel law Floci mesh bey-nafez.
x-aws-env: &aws-env
  AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://floci:4566}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
  CERTIFICATES_BUCKET: ${CERTIFICATES_BUCKET:-certificates}

services:
  init:
    build: ./infra/floci
    profiles: ["tools"]
    depends_on:
      - floci
    working_dir: /work/floci
    environment:
      <<: *aws-env
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-ett}
      POSTGRES_USER: ${POSTGRES_USER:-ett_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
      S2_URL: ${S2_URL:-http://s2:5002}
      S3_URL: ${S3_URL:-http://s3:5003}
      IAM_DIR: /work/iam
      DOCS_DIR: /work/docs
    volumes:
      - ./infra/floci:/work/floci:ro
      - ./infra/iam:/work/iam:ro
      - ./docs:/work/docs

  scheduler:
    build: ./infra/scheduler
    profiles: ["scheduler"]
    depends_on:
      - s2
      - s3
    environment:
      S2_URL: ${S2_URL:-http://s2:5002}
      S3_URL: ${S3_URL:-http://s3:5003}
      TOKEN_URL: ${COGNITO_TOKEN_URL:-}
      SERVICE_CLIENT_ID: ${SERVICE_CLIENT_ID:-}
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET:-}
