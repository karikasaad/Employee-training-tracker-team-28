# EN: runs the whole project locally: Floci (fake AWS), Postgres, the 3 services and nginx (HTTPS).
# Franco: beyshaghal el project kollo local: Floci (AWS fake), Postgres, el 3 services, w nginx (HTTPS).
# Start it with:  python scripts/dev.py up   (it also creates .env and the HTTPS certificate for you)
name: ett

# EN: settings shared by the three services. Values come from .env (copy of .env.example); defaults = dummy local values.
# Franco: settings moshtarka lel 3 services. El values men .env; el defaults values wahmeya lel local bas.
x-service-env: &service-env
  AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://floci:4566}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
  CERTIFICATES_BUCKET: ${CERTIFICATES_BUCKET:-certificates}
  # EN: the S3 address the BROWSER can reach (download links); inside Docker the services use AWS_ENDPOINT_URL.
  # Franco: 3enwan S3 elly el BROWSER yeqdar yewsal leh (links el download); gowwa Docker el services bet-estakhdem AWS_ENDPOINT_URL.
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:4566}
  # EN: e-mail settings of the daily check. The SendGrid key is NOT here: it comes from Secrets Manager (ett/sendgrid).
  #     SENDGRID_API_KEY is an optional override for local tests; empty = use the secret.
  # Franco: settings el e-mail bta3 el daily check. El SendGrid key MESH hena: gai men Secrets Manager (ett/sendgrid).
  #     SENDGRID_API_KEY ekhteyari lel tagareb el local bas; fadi = nesta3mel el secret.
  SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
  SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@example.com}
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${POSTGRES_DB:-ett}
  # EN: Cognito ids (public, not secrets); filled in .env after running cognito_init.js. Empty = login not configured yet.
  # Franco: ids bta3et Cognito (3ammeh, mesh secrets); betetmali fel .env ba3d cognito_init.js. Fadya = el login lessa mesh mazboot.
  COGNITO_ISSUER: ${COGNITO_ISSUER:-}
  COGNITO_WEB_CLIENT_ID: ${COGNITO_WEB_CLIENT_ID:-}
  COGNITO_SERVICE_CLIENT_ID: ${COGNITO_SERVICE_CLIENT_ID:-}
  COGNITO_JWKS_URL: ${COGNITO_JWKS_URL:-}
  S1_URL: ${S1_URL:-http://s1:5001}
  S2_URL: ${S2_URL:-http://s2:5002}
  S3_URL: ${S3_URL:-http://s3:5003}

services:
  # EN: Floci = local AWS emulator (S3, Secrets Manager, Cognito, CloudWatch, KMS, IAM...). One endpoint: port 4566.
  # Franco: Floci = emulator lel AWS 3ala gehazak. Endpoint wa7ed: port 4566.
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: ${FLOCI_STORAGE_MODE:-memory} # memory = starts empty each time; run "python scripts/dev.py init" again
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # needed only for Docker-backed Floci features (web console, RDS)

  # EN: Postgres stands in for RDS. The data lives in a named volume, so it survives restarts.
  # Franco: Postgres bey-3mel dor el RDS. El data fe volume, f mabetetmesh3 lama te3mel restart.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ett_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-ett}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # EN: the three backend services (Node + Express). Each one is built from its own folder.
  # Franco: el 3 services (Node + Express). Kol wa7da betetbeny men folder-ha.
  s1:
    # EN: context = repo root so the Dockerfile can copy services/common too.
    # Franco: context = root el repo 3ashan el Dockerfile yeqdar yenskh services/common kaman.
    build:
      context: .
      dockerfile: services/employee-training/Dockerfile
    environment:
      <<: *service-env
      PORT: "5001"
      # EN: this service logs in to Postgres with ITS OWN limited role, never the admin user.
      # Franco: el service di bet-dkhol Postgres bel role bta3ha el mahdood, 3omraha ma betest3mel el admin.
      DB_USER: svc_s1
      DB_PASSWORD: ${DB_S1_PASSWORD:?set DB_S1_PASSWORD in .env (copy .env.example)}
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy

  s2:
    # EN: context = repo root so the Dockerfile can copy services/common too.
    # Franco: context = root el repo 3ashan el Dockerfile yeqdar yenskh services/common kaman.
    build:
      context: .
      dockerfile: services/certificate-compliance/Dockerfile
    environment:
      <<: *service-env
      PORT: "5002"
      # EN: this service logs in to Postgres with ITS OWN limited role, never the admin user.
      # Franco: el service di bet-dkhol Postgres bel role bta3ha el mahdood, 3omraha ma betest3mel el admin.
      DB_USER: svc_s2
      DB_PASSWORD: ${DB_S2_PASSWORD:?set DB_S2_PASSWORD in .env (copy .env.example)}
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy

  s3:
    # EN: context = repo root so the Dockerfile can copy services/common too.
    # Franco: context = root el repo 3ashan el Dockerfile yeqdar yenskh services/common kaman.
    build:
      context: .
      dockerfile: services/dashboard-reports/Dockerfile
    environment:
      <<: *service-env
      PORT: "5003"
      # EN: this service logs in to Postgres with ITS OWN limited role, never the admin user.
      # Franco: el service di bet-dkhol Postgres bel role bta3ha el mahdood, 3omraha ma betest3mel el admin.
      DB_USER: svc_s3
      DB_PASSWORD: ${DB_S3_PASSWORD:?set DB_S3_PASSWORD in .env (copy .env.example)}
    ports:
      - "5003:5003"
    depends_on:
      postgres:
        condition: service_healthy

  # EN: nginx = the only door for the browser: HTTPS on 8443, HTTP 8080 redirects to HTTPS, serves frontend/, routes /api/*.
  # Franco: nginx = el bab el wa7ed lel browser: HTTPS 3ala 8443, el 8080 beyewadda lel HTTPS, beyedi frontend/, w beywaza3 /api/*.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8443:443"
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro # created by "python scripts/dev.py up"; never committed
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - s1
      - s2
      - s3

volumes:
  pgdata:
