# EN: Secret scan: gitleaks runs on every push and every pull request, over the WHOLE git history.
#     If it finds a secret (key, token, password) the job FAILS, so the PR cannot be merged by mistake.
#     It uses the gitleaks program itself (downloaded with a pinned version and a checksum check),
#     so no licence key and no third-party action are needed. Settings: .gitleaks.toml.
# Franco: Secret scan: gitleaks beyeshtaghal 3ala kol push w kol pull request, w beyfa7as el git history KOLLO.
#     Law la2a secret (key, token, password) el job beyFAIL, f el PR mayenfa3sh yet-merge bel ghalat.
#     Beyesta3mel barnameg gitleaks nafso (version sabet w check lel checksum), f mafeesh licence key
#     wala action men barra. El settings: .gitleaks.toml.
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read # EN: read-only, the job never writes / Franco: read bas, el job 3omro ma beyekteb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.18.4
    steps:
      # EN: fetch-depth 0 = the full history, because a secret removed in a later commit is still leaked.
      # Franco: fetch-depth 0 = el history kamel, 3ashan el secret elly etshal fe commit ba3deen lessa mat-sarrab.
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # EN: download the pinned release and verify its SHA-256 before running it.
      # Franco: nenazzel el release el sabet w nett2akked men el SHA-256 abl ma neshaghalo.
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o gitleaks.tar.gz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" checksums.txt | awk '{print $1 "  gitleaks.tar.gz"}' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # EN: --redact hides the secret in the log (we never print a secret, even a leaked one).
      #     --exit-code 1 makes the job fail when something is found.
      # Franco: --redact beyekhabbi el secret fel log (3omrena ma nektob secret, 7ata law mat-sarrab).
      #     --exit-code 1 beyekhalli el job yefshal lama yela2i 7aga.
      - name: Scan for secrets
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1
